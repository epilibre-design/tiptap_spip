site_name: Éditeur visuel pour SPIP
site_url: https://epilibre-design.github.io/tiptap_spip/
site_description: Installer et utiliser l'éditeur visuel Tiptap avec les raccourcis natifs de SPIP.
site_author: epilibre-design
repo_url: https://git.spip.net/spip-contrib-extensions/tiptap_spip
repo_name: spip-contrib-extensions/tiptap_spip
docs_dir: docs/site
site_dir: site

theme:
  name: material
  language: fr
  font: false
  icon:
    logo: material/text-box-edit-outline
    repo: fontawesome/brands/gitlab
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Visual editor for SPIP
          site_description: Install and use the Tiptap visual editor with native SPIP syntax.
          nav_translations:
            Accueil: Home
            Installer: Install
            Installation standard: Standard installation
            Depuis une archive: From an archive
            Depuis Git: From Git
            Plugins complémentaires: Optional plugins
            Premiers pas: Getting started
            Utiliser: Use the editor
            Contenu SPIP: SPIP content
            Notes de bas de page: Footnotes
            Images et documents: Images and documents
            Multilinguisme: Multilingual content
            Erreurs de syntaxe: Syntax issues
            Configurer: Configure
            Résoudre un problème: Troubleshoot
            Comprendre: Understand
            Principes: Principles
            Développer: Develop
            Créer une extension FAQ: Build a FAQ extension
            Réaliser les tests: Run the tests
            Maintenir cette documentation: Maintain this documentation

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
    absolute_links: warn

extra:
  generator: false

nav:
  - Accueil: index.md
  - Installer:
      - Installation standard: installer.md
      - Depuis une archive: installer/depuis-archive.md
      - Depuis Git: installer/depuis-git.md
      - Plugins complémentaires: installer/plugins-complementaires.md
  - Utiliser:
      - Premiers pas: premiers-pas.md
      - Contenu SPIP: utiliser/contenus-spip.md
      - Notes de bas de page: utiliser/notes-de-bas-de-page.md
      - Images et documents: utiliser/images-documents.md
      - Multilinguisme: utiliser/multilinguisme.md
      - Erreurs de syntaxe: utiliser/erreurs-de-syntaxe.md
  - Configurer: configurer.md
  - Résoudre un problème: problemes.md
  - Comprendre:
      - Principes: comprendre.md
  - Développer:
      - Créer une extension FAQ: developper/faq.md
      - Réaliser les tests: developper/tests.md
      - Maintenir cette documentation: developper/documentation.md
